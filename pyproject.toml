[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-tokenization"
version = "0.1.0"
description = "Fixed temporal patch vs RR/beat tokenization for self-supervised ECG representation learning on PTB-XL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Kept deliberately small: this is what a cloud training run installs.
    # Reading PTB-XL's WFDB files and plotting live in the extras below.
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # Pinned exactly, not floored. MLflow stamps an alembic revision into the
    # tracking database, and a database written by a newer MLflow cannot be
    # read by an older one -- `mlflow db upgrade` fails with "Can't locate
    # revision", because the revision is absent from the older install's
    # migration graph. Colab writes the database and a laptop reads it, so an
    # open floor lets those two drift into exactly that unrepairable state.
    "mlflow==3.16.1",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    # torch>=2.6 is required, not merely preferred: earlier versions trip the
    # CVE-2025-32434 torch.load check used by the HF model-loading path.
    "torch>=2.6",
]

[project.optional-dependencies]
# Needed only to BUILD the waveform store from PTB-XL's WFDB files, and for the
# R-peak analysis behind docs/. Training reads the store and never imports these.
preprocess = ["wfdb>=4.1", "neurokit2>=0.2.7", "scipy>=1.11"]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "jupyter", "ipykernel", "nbformat"]
dev = ["pytest>=7.4"]

[project.scripts]
ecg-download = "ecg.data.download:main"
ecg-preprocess = "ecg.data.preprocess:main"
ecg-run = "ecg.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
