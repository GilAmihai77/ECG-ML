[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-tokenization"
version = "0.1.0"
description = "Fixed temporal patch vs RR/beat tokenization for self-supervised ECG representation learning on PTB-XL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "wfdb>=4.1",
    "neurokit2>=0.2.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# torch>=2.6 is required, not merely preferred: earlier versions trip the
# CVE-2025-32434 torch.load check used by the HF model-loading path.
torch = ["torch>=2.6", "safetensors"]
dev = ["pytest>=7.4", "jupyter", "ipykernel", "nbformat"]

[project.scripts]
ecg-download = "ecg.data.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
